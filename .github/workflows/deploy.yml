name: Deploy
# main    -> production (www.whoneedsa1099.com), test unlock forbidden by check:release
# preview -> Cloudflare Pages preview URL (preview.<project>.pages.dev) with test unlock on
on:
  push:
    branches: [main, preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency: deploy-${{ github.ref_name }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IS_PROD: ${{ github.ref_name == 'main' }}
      VITE_SITE_URL: https://www.whoneedsa1099.com
      VITE_PAYMENTS_ENABLED: ${{ github.ref_name == 'main' && vars.PAYMENTS_ENABLED || 'false' }}
      VITE_TEST_UNLOCK: ${{ github.ref_name == 'preview' && 'true' || 'false' }}
      VITE_CHECKOUT_SINGLE_URL: ${{ vars.CHECKOUT_SINGLE_URL }}
      VITE_CHECKOUT_PACK_URL: ${{ vars.CHECKOUT_PACK_URL }}
      VITE_CF_BEACON_TOKEN: ${{ github.ref_name == 'main' && vars.CF_BEACON_TOKEN || '' }}
      VITE_SELLER_NAME: ${{ vars.SELLER_NAME }}
      VITE_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'whoneedsa1099' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm's "xlsx" stops at 0.18.5 (known advisories); SheetJS publishes fixes on its own CDN.
      - run: npm i --no-save https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
      - run: npm run typecheck && npm test
      - run: npm run build
      - name: Release check (production only)
        if: env.IS_PROD == 'true'
        run: npm run check:release
      - name: Keep preview builds out of search engines
        if: env.IS_PROD != 'true'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      - name: Create Pages project if missing
        run: |
          npx wrangler pages project list | grep -qw "$PAGES_PROJECT" \
            || npx wrangler pages project create "$PAGES_PROJECT" --production-branch=main
      - name: Deploy site (Cloudflare Pages)
        run: npx wrangler pages deploy dist --project-name="$PAGES_PROJECT" --branch="${{ github.ref_name }}"
      - name: Deploy license Worker (production only)
        if: env.IS_PROD == 'true'
        working-directory: worker
        run: |
          npx wrangler deploy --env production \
            --var PAYMENTS_ENABLED:"${{ vars.PAYMENTS_ENABLED || 'false' }}" \
            --var POLAR_API_BASE:"${{ vars.POLAR_API_BASE || 'https://sandbox-api.polar.sh' }}" \
            --var POLAR_ORG_ID:"${{ vars.POLAR_ORG_ID }}" \
            --var POLAR_BENEFIT_SINGLE:"${{ vars.POLAR_BENEFIT_SINGLE }}" \
            --var POLAR_BENEFIT_PACK:"${{ vars.POLAR_BENEFIT_PACK }}" \
            --var ALLOWED_ORIGINS:""
