name = "whoneedsa1099-license"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

# Same-origin API: the Worker answers www.whoneedsa1099.com/api/* in front of Cloudflare Pages.
routes = [{ pattern = "www.whoneedsa1099.com/api/*", zone_name = "whoneedsa1099.com" }]

[vars]
PAYMENTS_ENABLED = "false"
POLAR_API_BASE = "https://sandbox-api.polar.sh"
POLAR_ORG_ID = ""
POLAR_BENEFIT_SINGLE = ""
POLAR_BENEFIT_PACK = ""
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173"

[env.production.vars]
PAYMENTS_ENABLED = "false"
POLAR_API_BASE = "https://api.polar.sh"
POLAR_ORG_ID = ""
POLAR_BENEFIT_SINGLE = ""
POLAR_BENEFIT_PACK = ""
ALLOWED_ORIGINS = ""
